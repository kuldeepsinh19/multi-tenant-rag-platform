[project]
name = "platform-backend"
version = "0.1.0"
description = "Multi-tenant RAG chatbot platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (latest release) probes bcrypt's internals via a now-removed
    # `bcrypt.__about__` attribute and mishandles the fallback, breaking hashing
    # entirely on bcrypt>=4.1 (https://github.com/pyca/bcrypt/issues/684). Pin
    # below that ceiling until passlib ships a fix.
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# LLM/embedding provider adapters (see src/llm/) — kept separate so adding a
# provider later is `pip install` + one adapter file, not a core dep bump.
llm = [
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "instructor>=1.6",
]
# Agent orchestration
agent = [
    "langgraph>=0.2",
]
# Ingestion + retrieval. Kept pragmatic: llama-index-core gives us a semantic-ish
# SentenceSplitter for chunking without pulling in the full framework; pypdf/python-docx
# are lightweight parsers for the two binary formats we support. unstructured/fastembed/
# llama-index-readers-file are not needed for this stage's straightforward txt/md/pdf/docx
# extraction, so they're left out rather than installed unused.
rag = [
    "llama-index-core>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Lightweight ONNX cross-encoder reranker (no torch) for hybrid-search reranking.
    "fastembed>=0.4",
]
# Guardrails. Presidio (PII) is declared but NOT installed by default: it pulls spacy +
# a model download that bloats the image and flakes in CI. The guardrail layer uses
# pure-Python regex/heuristic screening plus Instructor (from the `llm` extra) for
# structured-output enforcement — install this extra only if you want Presidio's
# statistical PII detection on top.
guardrails = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# Tracing / observability — light, always installed with the running image.
evals = [
    "langfuse>=2.53",
]
# Offline eval metrics (Ragas). Heavy (pulls a datasets/LLM stack); kept OUT of the
# running image. The Ragas runner in scripts/ is a standalone offline tool — install
# this extra in the eval/CI environment only, not in the API/worker container.
evals-offline = [
    "ragas>=0.2",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerate output — not hand-styled, and reformatting it risks silently
# altering generated DDL. Linted at generation time only, via `alembic revision`.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's documented
# dependency-injection pattern, not the mutable-default-argument footgun this rule
# targets — every route/dependency in this codebase uses it intentionally.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks slow tests (deselect with -m 'not slow')"]

# pytest-cov was already a dev dependency but had no configuration, so coverage
# was never measurable. No fail_under gate yet: this repo has no CI to gate, so
# the first job is to establish a baseline number. Adding a threshold here is a
# one-line follow-up once that baseline is agreed.
[tool.coverage.run]
source = ["src"]
omit = ["src/evals/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
