services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./platform-backend
      args:
        INSTALL_EXTRAS: dev,llm,rag,agent,evals
    env_file:
      - ./platform-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./platform-backend/src:/app/src
      - ./platform-backend/tests:/app/tests
      - ./platform-backend/migrations:/app/migrations
      - ./platform-backend/scripts:/app/scripts
      - ./platform-backend/pyproject.toml:/app/pyproject.toml
      - ./platform-backend/uploads:/app/uploads

  worker:
    build:
      context: ./platform-backend
      args:
        INSTALL_EXTRAS: dev,llm,rag,agent,evals
    command: ["arq", "src.core.worker.WorkerSettings"]
    env_file:
      - ./platform-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./platform-backend/src:/app/src
      - ./platform-backend/pyproject.toml:/app/pyproject.toml
      - ./platform-backend/uploads:/app/uploads

  frontend:
    build:
      context: ./platform-frontend
    env_file:
      - ./platform-frontend/.env.local
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./platform-frontend/src:/app/src
      - ./platform-frontend/index.html:/app/index.html

volumes:
  postgres_data:
